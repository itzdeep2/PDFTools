<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local PDF Tool</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="container">
<h1>PDF Utilities</h1>
<div id="tools-wrapper">
<div class="tool-section" id="merge-sec">
    <h2>Merge PDFs</h2>
    <input type="file" id="merge-files" multiple accept="application/pdf">
    <button onclick="mergePDFs()">Merge Files</button>
</div>
<div class="tool-section" id="split-sec">
<h2>Split First Page</h2>
<input type="file" id="split-file" accept="application/pdf">
<button onclick="splitPDF()">Extract Page 1</button>
</div>
<div class="tool-section" id="jpg-sec">
<h2>PDF to JPG (Page 1)</h2>
<input type="file" id="jpg-file" accept="application/pdf">
<button onclick="convertPdfToJpg()">Convert</button>
<canvas id="pdf-canvas" style="display:none;"></canvas>
</div>
<div class="tool-section" id="unlock-sec">
<h2>Remove Password</h2>
<input type="file" id="unlock-file" accept="application/pdf">
<input type="text" id="pdf-pass" placeholder="Enter password">
<button onclick="removePassword()">Unlock and Save</button>
</div>
<div class="tool-section" id="ocr-sec">
<h2>OCR (PDF to Text - Page 1)</h2>
<input type="file" id="ocr-file" accept="application/pdf, image/*">
<button onclick="runOCR()">Extract Text</button>
<p id="ocr-result"></p>
</div>
<div class="tool-section" id="add-text-sec">
<h2>Add Text to PDF</h2>
<input type="file" id="text-pdf-file" accept="application/pdf">
<input type="text" id="pdf-text-input" placeholder="Text to add">
<button onclick="addTextToPdf()">Add Text</button>
</div>
<div class="tool-section" id="compress-sec">
<h2>Basic Compress</h2>
<input type="file" id="compress-file" accept="application/pdf">
<button onclick="compressPdf()">Compress</button>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
